{% extends 'base.html' %}

{% block content %}
    <h1 class="mb-4">📊 우리 커뮤니티 분석 리포트</h1>
    
    {% if no_data %}
        <div class="alert alert-warning">
            아직 분석할 데이터(게시글)가 없습니다! 글을 먼저 작성해주세요. ✍️
        </div>
    {% else %}
        <div class="alert alert-info">
            현재까지 누적된 총 게시글 수는 <strong>{{ total_posts }}개</strong> 입니다.
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        🏆 열혈 작성자 TOP 5
                    </div>
                    <div class="card-body">
                        {{ top_writers_table | safe }}
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-warning text-dark">
                        🍕 카테고리별 점유율
                    </div>
                    <div class="card-body text-center">
                        <img src="data:image/png;base64,{{ pie_chart }}" style="max-width: 80%; height: auto;">
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        📈 일별 게시글 등록 추이
                    </div>
                    <div class="card-body text-center">
                        <img src="data:image/png;base64,{{ daily_trend_graph }}" style="max-width: 100%; height: auto;">
                    </div>
                </div>
            </div>
        </div>
    {% endif %}
{% endblock %}
